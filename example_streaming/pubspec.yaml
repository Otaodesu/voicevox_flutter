name: example_streaming
description: "VOICEVOX streaming synthesis example application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  voicevox_flutter:
    path: ../

  flutter_sound: ^9.30.0
  path_provider: ^2.1.5
  path: ^1.8.3
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/open_jtalk_dic_utf_8-1.11/
    - assets/model/
